<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kleiderschrank</title>
  <meta name="description" content="Kleidung fotografieren, tägliche Outfit-Vorschläge passend zum Wetter und Reise-Outfits mit Packliste planen.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Heute</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-tab="heute" class="active"><span>✨</span>Heute</button>
    <button data-tab="schrank"><span>🚪</span>Schrank</button>
    <button data-tab="reisen"><span>🧳</span>Reisen</button>
    <button data-tab="mehr"><span>⚙️</span>Mehr</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="galleryInput" accept="image/*" multiple hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
